worker_processes auto;

events {
    worker_connections 8192;
}

http {
    upstream auth_service_pool {
        least_conn;
        server auth-service-1:8000 max_fails=2 fail_timeout=10s;
        server auth-service-2:8000 max_fails=2 fail_timeout=10s;
        server auth-service-3:8000 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    upstream order_service_pool {
        least_conn;
        server order-service-1:8000 max_fails=2 fail_timeout=10s;
        server order-service-2:8000 max_fails=2 fail_timeout=10s;
        server order-service-3:8000 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    upstream inventory_service_pool {
        least_conn;
        server inventory-service-1:8000 max_fails=2 fail_timeout=10s;
        server inventory-service-2:8000 max_fails=2 fail_timeout=10s;
        server inventory-service-3:8000 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    upstream notification_service_pool {
        least_conn;
        server notification-service-1:8000 max_fails=2 fail_timeout=10s;
        server notification-service-2:8000 max_fails=2 fail_timeout=10s;
        server notification-service-3:8000 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1000;

    log_format upstreamlog '$remote_addr - $request $status '
                           'upstream=$upstream_addr request_time=$request_time '
                           'upstream_response_time=$upstream_response_time';

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log upstreamlog;
        client_max_body_size 10m;
        keepalive_timeout 65;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Gateway finmark-microservice-gateway;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # The frontend health checker calls /api/v1/health. This verifies that
        # the gateway is alive; each microservice also exposes /api/v1/health.
        location = /api/v1/health {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway","message":"Microservice gateway is running"}';
        }

        location = /api/v1/ready {
            proxy_pass http://auth_service_pool;
        }

        location = /api/v1/service-info {
            default_type application/json;
            return 200 '{"service":"api-gateway","routing":"auth/order/inventory/notification","replicas_per_service":3}';
        }

        location /api/v1/auth/ {
            proxy_pass http://auth_service_pool;
        }

        location /api/v1/data/ {
            proxy_pass http://auth_service_pool;
        }

        location /api/v1/database/ {
            proxy_pass http://auth_service_pool;
        }

        location /api/v1/inventory/ {
            proxy_pass http://inventory_service_pool;
        }

        location /api/v1/orders/ {
            proxy_pass http://order_service_pool;
        }

        location /api/v1/shop/ {
            proxy_pass http://order_service_pool;
        }

        location /api/v1/notifications {
            proxy_pass http://notification_service_pool;
        }
    }
}
