services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: finmark_db
      MYSQL_USER: finmark_app
      MYSQL_PASSWORD: finmark_password_change_me
      MYSQL_ROOT_PASSWORD: root_password_change_me
    command:
      - --max_connections=300
      - --innodb_buffer_pool_size=512M
      - --innodb_flush_log_at_trx_commit=2
    volumes:
      - finmark_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      SECRET_KEY: replace-with-a-real-64-character-secret
      FRONTEND_ORIGINS: http://localhost
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: mysql+pymysql://finmark_app:finmark_password_change_me@mysql:3306/finmark_db
      AUTO_CREATE_DB: "false"
      SEED_DEMO_DATA: "false"
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 40
      DB_POOL_TIMEOUT: 30
      DB_POOL_RECYCLE: 1800
      THREADPOOL_TOKENS: 100
      PRODUCT_CACHE_MAX_AGE_SECONDS: 60
      WEB_CONCURRENCY: 4
    deploy:
      replicas: 1
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  finmark_mysql_data:
