<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container auth-container">
        <section class="auth-card">
            <form id="resetPasswordForm" class="login-form auth-form">
                <h2>Reset Password</h2>

                <div class="form-group">
                    <label for="newPassword">New Password:</label>
                    <input type="password" id="newPassword" name="new_password" autocomplete="new-password" required>
                    <ul id="passwordRequirements" class="password-requirements" aria-live="polite">
                        <li data-rule="length">At least 8 characters</li>
                        <li data-rule="lowercase">One lowercase letter</li>
                        <li data-rule="uppercase">One uppercase letter</li>
                        <li data-rule="number">One number</li>
                        <li data-rule="special">One special character</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password:</label>
                    <input type="password" id="confirmNewPassword" name="confirm_password" autocomplete="new-password" required>
                </div>

                <button type="submit" data-default-label="Reset password" data-loading-label="Resetting...">
                    <span class="button-spinner" aria-hidden="true"></span>
                    <span class="button-label">Reset password</span>
                </button>
                <p id="resetMessage" class="message" role="status" aria-live="polite"></p>

                <p class="auth-switch-text">
                    <a href="index.html" class="plain-link">Back to login</a>
                </p>
            </form>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
